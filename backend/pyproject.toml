[project]
name = "buildshare-backend"
version = "1.0.0"
description = "Backend for BuildShare Android distribution platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "celery>=5.6.3",
    "amqp>=5.3.0",
    "boto3>=1.35.0",
    "pyaxmlparser>=0.3.31",
    "androguard>=4.1.3",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
]

[tool.uv]
managed = true

[project.scripts]
serve = "uvicorn app.main:app --reload"

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "N", "S", "B", "T20", "RET", "SIM", "ARG", "PTH", "ERA", "PL"]
ignore = ["S101", "B008", "S105", "ARG001", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "RET504", "RET505"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "S106", "PLR2004", "ERA001", "ARG", "E501"]
"app/api/*" = ["E501"]
"app/models/*" = ["E501"]
"app/tasks/*" = ["E501"]
"app/libs/*" = ["E501"]
"app/main.py" = ["E501", "PLC0415"]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = false
disallow_any_generics = false
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["*.tests.*", "config.*", "core.*", "users.*", "projects.*", "binaries.*", "notifications.*", "libs.*", "android"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["app.tasks.*", "app.tasks.celery_app"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["app.api.*", "app.main", "app.services.*", "app.models.*"]
ignore_errors = true

[tool.pytest.ini_options]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
